<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #06040c; overflow: hidden; }
  a { color: #e8cf8f; text-decoration: none; }
  a:hover { color: #fff3d0; }
  @keyframes breathe { 0%,100% { transform: scale(1.035) translateY(0px); } 50% { transform: scale(1.043) translateY(-7px); } }
  @keyframes swayA { 0%,100% { transform: translate3d(0,0,0) rotate(0deg); } 50% { transform: translate3d(-10px,4px,0) rotate(0.35deg); } }
  @keyframes smokeRise {
    0%   { transform: translate3d(0,0,0) scale(0.55) rotate(0deg); opacity: 0; }
    18%  { opacity: 0.75; }
    60%  { transform: translate3d(14px,-120px,0) scale(1.25) rotate(70deg); opacity: 0.5; }
    100% { transform: translate3d(-18px,-240px,0) scale(2.1) rotate(150deg); opacity: 0; }
  }
  @keyframes smokeRise2 {
    0%   { transform: translate3d(0,0,0) scale(0.6) rotate(0deg); opacity: 0; }
    22%  { opacity: 0.65; }
    100% { transform: translate3d(26px,-210px,0) scale(1.95) rotate(-140deg); opacity: 0; }
  }
  @keyframes mistDrift { 0% { transform: translate3d(-6%,0,0) scale(1.1); } 50% { transform: translate3d(6%,-2%,0) scale(1.25); } 100% { transform: translate3d(-6%,0,0) scale(1.1); } }
  @keyframes flashA { 0%,4.2%,100% { opacity: 0; } 1.1% { opacity: 0.55; } 1.7% { opacity: 0.12; } 2.4% { opacity: 0.72; } 3.2% { opacity: 0.05; } }
  @keyframes flashB { 0%,3%,100% { opacity: 0; } 0.7% { opacity: 0.4; } 1.4% { opacity: 0.08; } 2% { opacity: 0.5; } }
  @keyframes boltA { 0%,2.6%,100% { opacity: 0; } 0.5% { opacity: 0.9; } 1.1% { opacity: 0.15; } 1.6% { opacity: 0.7; } }
  @keyframes emberFloat { 0% { transform: translate3d(0,20px,0); opacity: 0; } 20% { opacity: 0.9; } 100% { transform: translate3d(30px,-320px,0); opacity: 0; } }
  @keyframes potionPulse { 0%,100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.14); } }
  @keyframes chainSway { 0%,100% { transform: rotate(-0.5deg); } 50% { transform: rotate(0.5deg); } }
  @keyframes uiRise { 0% { opacity: 0; transform: translateY(24px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes runeSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</helmet>

<div style="position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #06040c; font-family: 'Cinzel', serif; user-select: none;">

  <div style="position: absolute; inset: -4%; background-image: url('art/title-scene.png'); background-size: cover; background-position: center 36%; animation: breathe 9s ease-in-out infinite; will-change: transform;"></div>

  <div style="position: absolute; inset: -4%; background-image: url('art/title-scene.png'); background-size: cover; background-position: center 36%; mix-blend-mode: screen; opacity: 0.28; filter: blur(26px) saturate(1.5); animation: swayA 14s ease-in-out infinite; pointer-events: none;"></div>

  <div style="position: absolute; inset: 0; pointer-events: none; overflow: hidden;">
    <div style="position: absolute; left: 0; right: 0; top: -10%; height: 62%; background: radial-gradient(60% 70% at 50% 22%, rgba(198,150,255,0.85), rgba(150,90,255,0.25) 45%, rgba(0,0,0,0) 72%); mix-blend-mode: screen; animation: flashA 13s linear infinite;"></div>
    <div style="position: absolute; inset: 0; background: radial-gradient(80% 60% at 22% 8%, rgba(226,214,255,0.8), rgba(120,80,220,0.18) 50%, rgba(0,0,0,0) 78%); mix-blend-mode: screen; animation: flashB 19s linear infinite; animation-delay: 5s;"></div>
    <div style="position: absolute; left: 58%; top: -6%; width: 3px; height: 46%; background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(200,170,255,0.5) 60%, rgba(180,140,255,0) 100%); filter: blur(1.6px) drop-shadow(0 0 26px rgba(190,150,255,0.95)); transform-origin: top center; transform: rotate(6deg); animation: boltA 13s linear infinite; animation-delay: 0.02s;"></div>
    <div style="position: absolute; left: 24%; top: -8%; width: 2px; height: 34%; background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(190,160,255,0) 100%); filter: blur(1.4px) drop-shadow(0 0 20px rgba(170,130,255,0.9)); transform-origin: top center; transform: rotate(-9deg); animation: boltA 19s linear infinite; animation-delay: 5.03s;"></div>
  </div>

  <div style="position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; filter: blur(18px);">
    <div style="position: absolute; left: 66.5%; top: 26%; width: 190px; height: 190px; margin: -95px 0 0 -95px; border-radius: 50%; background: radial-gradient(circle, rgba(206,140,255,0.9), rgba(150,70,240,0.35) 45%, rgba(0,0,0,0) 70%); animation: smokeRise 7s ease-out infinite;"></div>
    <div style="position: absolute; left: 67.5%; top: 27%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: radial-gradient(circle, rgba(226,178,255,0.75), rgba(140,60,230,0.3) 50%, rgba(0,0,0,0) 72%); animation: smokeRise2 9.5s ease-out infinite; animation-delay: 2.4s;"></div>
    <div style="position: absolute; left: 65.5%; top: 25%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: radial-gradient(circle, rgba(190,120,255,0.7), rgba(0,0,0,0) 68%); animation: smokeRise 11s ease-out infinite; animation-delay: 4.6s;"></div>

    <div style="position: absolute; left: 5%; top: 62%; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; background: radial-gradient(circle, rgba(110,255,220,0.7), rgba(40,190,170,0.25) 48%, rgba(0,0,0,0) 72%); animation: smokeRise2 10s ease-out infinite; animation-delay: 1.2s;"></div>
    <div style="position: absolute; left: 8%; top: 66%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: radial-gradient(circle, rgba(150,255,230,0.6), rgba(0,0,0,0) 70%); animation: smokeRise 13s ease-out infinite; animation-delay: 6s;"></div>

    <div style="position: absolute; left: 94%; top: 58%; width: 210px; height: 210px; margin: -105px 0 0 -105px; border-radius: 50%; background: radial-gradient(circle, rgba(120,255,225,0.65), rgba(50,180,255,0.2) 50%, rgba(0,0,0,0) 74%); animation: smokeRise 12s ease-out infinite; animation-delay: 3s;"></div>
    <div style="position: absolute; left: 91%; top: 70%; width: 160px; height: 160px; margin: -80px 0 0 -80px; border-radius: 50%; background: radial-gradient(circle, rgba(210,140,255,0.6), rgba(0,0,0,0) 70%); animation: smokeRise2 8.5s ease-out infinite; animation-delay: 5.5s;"></div>

    <div style="position: absolute; left: 12%; top: 88%; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%; background: radial-gradient(circle, rgba(190,110,255,0.6), rgba(0,0,0,0) 70%); animation: smokeRise 9s ease-out infinite; animation-delay: 2s;"></div>
    <div style="position: absolute; left: 86%; top: 90%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: radial-gradient(circle, rgba(120,255,215,0.55), rgba(0,0,0,0) 70%); animation: smokeRise2 11.5s ease-out infinite; animation-delay: 7s;"></div>
  </div>

  <div style="position: absolute; left: -10%; right: -10%; bottom: -6%; height: 46%; pointer-events: none; mix-blend-mode: screen; filter: blur(32px); background: radial-gradient(50% 60% at 50% 70%, rgba(80,230,190,0.34), rgba(60,180,255,0.12) 45%, rgba(0,0,0,0) 75%); animation: mistDrift 26s ease-in-out infinite;"></div>

  <div style="position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;">
    <div style="position: absolute; left: 66.8%; top: 27%; width: 88px; height: 88px; margin: -44px 0 0 -44px; border-radius: 50%; background: radial-gradient(circle, rgba(236,190,255,0.95), rgba(150,60,240,0.3) 45%, rgba(0,0,0,0) 70%); filter: blur(9px); animation: potionPulse 3.6s ease-in-out infinite;"></div>
    <div style="position: absolute; left: 4.5%; top: 63%; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; background: radial-gradient(circle, rgba(150,255,235,0.8), rgba(0,0,0,0) 68%); filter: blur(11px); animation: potionPulse 5.2s ease-in-out infinite; animation-delay: 1.1s;"></div>
    <div style="position: absolute; left: 95%; top: 60%; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; background: radial-gradient(circle, rgba(150,255,235,0.75), rgba(0,0,0,0) 68%); filter: blur(12px); animation: potionPulse 4.4s ease-in-out infinite; animation-delay: 2.3s;"></div>
  </div>

  <div style="position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;">
    <div style="position: absolute; left: 18%; bottom: 8%; width: 3px; height: 3px; border-radius: 50%; background: #ffe6a8; box-shadow: 0 0 8px 2px rgba(255,215,140,0.8); animation: emberFloat 14s linear infinite;"></div>
    <div style="position: absolute; left: 34%; bottom: 4%; width: 2px; height: 2px; border-radius: 50%; background: #cbb0ff; box-shadow: 0 0 8px 2px rgba(190,150,255,0.8); animation: emberFloat 19s linear infinite; animation-delay: 3s;"></div>
    <div style="position: absolute; left: 52%; bottom: 6%; width: 3px; height: 3px; border-radius: 50%; background: #a8ffe6; box-shadow: 0 0 9px 2px rgba(140,255,225,0.75); animation: emberFloat 17s linear infinite; animation-delay: 7s;"></div>
    <div style="position: absolute; left: 71%; bottom: 5%; width: 2px; height: 2px; border-radius: 50%; background: #ffe6a8; box-shadow: 0 0 8px 2px rgba(255,215,140,0.7); animation: emberFloat 22s linear infinite; animation-delay: 11s;"></div>
    <div style="position: absolute; left: 84%; bottom: 9%; width: 3px; height: 3px; border-radius: 50%; background: #cbb0ff; box-shadow: 0 0 9px 2px rgba(190,150,255,0.7); animation: emberFloat 16s linear infinite; animation-delay: 5s;"></div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 46%; pointer-events: none; background: linear-gradient(180deg, rgba(6,3,14,0) 0%, rgba(6,3,14,0.34) 12%, rgba(6,3,14,0.72) 26%, rgba(5,2,12,0.95) 46%, #06040c 66%, #06040c 100%);"></div>

  <div style="position: absolute; left: -10%; right: -10%; bottom: 12%; height: 22%; pointer-events: none; mix-blend-mode: screen; filter: blur(40px); background: radial-gradient(48% 60% at 50% 100%, rgba(80,230,190,0.3), rgba(120,80,220,0.14) 50%, rgba(0,0,0,0) 78%);"></div>

  <div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(72% 62% at 50% 40%, rgba(0,0,0,0) 42%, rgba(4,2,10,0.5) 76%, rgba(3,1,8,0.9) 100%);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 0 24px 38px; animation: uiRise 1.2s cubic-bezier(0.16,1,0.3,1) both;">

    <div style="display: flex; align-items: stretch; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 620px;">
      <div role="button" tabindex="0" style="position: relative; flex: 1 1 240px; max-width: 290px; padding: 13px 22px 15px; text-align: center; cursor: pointer; border: 1px solid rgba(232,207,143,0.75); border-radius: 5px; background: linear-gradient(180deg, rgba(84,44,140,0.92), rgba(44,20,80,0.94)); box-shadow: inset 0 1px 0 rgba(255,236,190,0.28), inset 0 0 26px rgba(150,90,230,0.4), 0 10px 34px rgba(0,0,0,0.6); transition: transform 220ms ease, box-shadow 220ms ease, background 220ms ease;" style-hover="transform: translateY(-2px); background: linear-gradient(180deg, rgba(108,58,176,0.96), rgba(58,26,104,0.96)); box-shadow: inset 0 1px 0 rgba(255,240,205,0.4), inset 0 0 34px rgba(186,130,255,0.55), 0 14px 44px rgba(120,60,200,0.45);" style-active="transform: translateY(1px);">
        <span style="display: block; font-size: 22px; font-weight: 700; letter-spacing: 0.15em; color: #f6e6bd; text-shadow: 0 0 18px rgba(190,140,255,0.55), 0 2px 2px rgba(0,0,0,0.8);">STORY MODE</span>
        <span style="display: block; margin-top: 4px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; letter-spacing: 0.05em; color: rgba(226,208,255,0.72);">Descend through Aldric's trials</span>
      </div>

      <div role="button" tabindex="0" style="position: relative; flex: 1 1 240px; max-width: 290px; padding: 13px 22px 15px; text-align: center; cursor: pointer; border: 1px solid rgba(150,235,215,0.5); border-radius: 5px; background: linear-gradient(180deg, rgba(18,58,66,0.88), rgba(10,30,42,0.92)); box-shadow: inset 0 1px 0 rgba(190,255,240,0.2), inset 0 0 26px rgba(50,190,170,0.28), 0 10px 34px rgba(0,0,0,0.6); transition: transform 220ms ease, box-shadow 220ms ease, background 220ms ease;" style-hover="transform: translateY(-2px); background: linear-gradient(180deg, rgba(26,82,90,0.94), rgba(14,44,58,0.94)); box-shadow: inset 0 1px 0 rgba(200,255,245,0.32), inset 0 0 34px rgba(90,235,205,0.42), 0 14px 44px rgba(40,180,160,0.35);" style-active="transform: translateY(1px);">
        <span style="display: block; font-size: 22px; font-weight: 700; letter-spacing: 0.15em; color: #eaf6e2; text-shadow: 0 0 18px rgba(120,255,220,0.4), 0 2px 2px rgba(0,0,0,0.8);">FREE PLAY</span>
        <span style="display: block; margin-top: 4px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; letter-spacing: 0.05em; color: rgba(206,240,232,0.7);">Wander any maze, no consequence</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; opacity: 0.75;">
      <div style="width: 72px; height: 1px; background: linear-gradient(90deg, rgba(232,207,143,0), rgba(232,207,143,0.6));"></div>
      <div style="width: 7px; height: 7px; background: #c68cff; transform: rotate(45deg); box-shadow: 0 0 12px rgba(190,120,255,0.9);"></div>
      <div style="width: 72px; height: 1px; background: linear-gradient(90deg, rgba(232,207,143,0.6), rgba(232,207,143,0));"></div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 68px;">
      <div role="button" tabindex="0" style="display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; color: #e8cf8f; transition: color 200ms ease, transform 200ms ease;" style-hover="color: #fff3d0; transform: translateY(-2px);">
        <div style="width: 46px; height: 46px; border: 1px solid rgba(232,207,143,0.55); border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(10,6,20,0.55); box-shadow: inset 0 0 16px rgba(150,90,230,0.3);">
          <div style="width: 18px; height: 14px; border: 1.5px solid currentColor; border-radius: 1px; position: relative;">
            <div style="position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1.5px; background: currentColor;"></div>
          </div>
        </div>
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.18em;">HOW TO PLAY</span>
      </div>

      <div role="button" tabindex="0" style="display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; color: #e8cf8f; transition: color 200ms ease, transform 200ms ease;" style-hover="color: #fff3d0; transform: translateY(-2px);">
        <div style="width: 46px; height: 46px; border: 1px solid rgba(232,207,143,0.55); border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(10,6,20,0.55); box-shadow: inset 0 0 16px rgba(150,90,230,0.3);">
          <div style="width: 20px; height: 20px; border: 1.5px solid currentColor; border-radius: 50%; position: relative; animation: runeSpin 22s linear infinite;">
            <div style="position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border: 1.5px solid currentColor; border-radius: 50%;"></div>
            <div style="position: absolute; left: 50%; top: -4px; width: 1.5px; height: 5px; margin-left: -0.75px; background: currentColor;"></div>
            <div style="position: absolute; left: 50%; bottom: -4px; width: 1.5px; height: 5px; margin-left: -0.75px; background: currentColor;"></div>
            <div style="position: absolute; top: 50%; left: -4px; width: 5px; height: 1.5px; margin-top: -0.75px; background: currentColor;"></div>
            <div style="position: absolute; top: 50%; right: -4px; width: 5px; height: 1.5px; margin-top: -0.75px; background: currentColor;"></div>
          </div>
        </div>
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.18em;">SETTINGS</span>
      </div>
    </div>
  </div>
</div>

</x-dc>

</html>
