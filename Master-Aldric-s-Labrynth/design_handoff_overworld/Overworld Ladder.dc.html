<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#1b1230;overflow:hidden}
a{color:#caa14a}a:hover{color:#e0bd6c}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(28px,-34px)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.7}}
</style>
</helmet>
<div style="width:100vw;height:100vh;background:#1b1230;display:flex;align-items:center;justify-content:center;overflow:hidden">
<div style="{{ stage }}">
<svg viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0;display:block">
<defs>
<radialGradient id="lsky" cx="0.5" cy="0.04" r="0.98">
<stop offset="0" stop-color="#33235c"></stop>
<stop offset="0.45" stop-color="#241a44"></stop>
<stop offset="1" stop-color="#160f28"></stop>
</radialGradient>
<linearGradient id="lground" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#241a42"></stop>
<stop offset="0.55" stop-color="#1d1435"></stop>
<stop offset="1" stop-color="#170f2a"></stop>
</linearGradient>
<radialGradient id="lmoonhalo" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#f4ead6" stop-opacity="0.42"></stop>
<stop offset="0.35" stop-color="#c9b8e8" stop-opacity="0.16"></stop>
<stop offset="1" stop-color="#c9b8e8" stop-opacity="0"></stop>
</radialGradient>
<radialGradient id="llamp" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ffd79a" stop-opacity="0.75"></stop>
<stop offset="1" stop-color="#ffd79a" stop-opacity="0"></stop>
</radialGradient>
<linearGradient id="lmistg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#c9b8e8" stop-opacity="0"></stop>
<stop offset="0.5" stop-color="#c9b8e8" stop-opacity="0.13"></stop>
<stop offset="1" stop-color="#c9b8e8" stop-opacity="0"></stop>
</linearGradient>
<filter id="lglow" x="-120%" y="-120%" width="340%" height="340%">
<feGaussianBlur stdDeviation="6" result="b"></feGaussianBlur>
<feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
</filter>
</defs>

<rect x="0" y="0" width="1920" height="1080" fill="url(#lsky)"></rect>

<sc-for list="{{ stars }}" as="s" hint-placeholder-count="0">
<circle cx="{{ s.x }}" cy="{{ s.y }}" r="{{ s.r }}" fill="#f4ead6" style="{{ s.style }}"></circle>
</sc-for>

<g>
<circle cx="1712" cy="128" r="170" fill="url(#lmoonhalo)"></circle>
<circle cx="1712" cy="128" r="54" fill="#f4ead6"></circle>
<circle cx="1712" cy="128" r="54" fill="#e6dcc6" opacity="0.5"></circle>
<circle cx="1696" cy="114" r="9.5" fill="#d8ccb2" opacity="0.75"></circle>
<circle cx="1728" cy="142" r="6.5" fill="#d8ccb2" opacity="0.6"></circle>
</g>

<path d="M0,268 L0,214 L46,214 L46,190 L92,190 L92,222 L150,222 L150,196 L214,196 L214,228 L268,228 L268,202 L332,202 L332,232 L392,232 L392,198 L452,198 L452,226 L520,226 L520,204 L586,204 L586,234 L648,234 L648,206 L716,206 L716,230 L782,230 L782,200 L850,200 L850,228 L918,228 L918,208 L988,208 L988,232 L1054,232 L1054,198 L1122,198 L1122,226 L1190,226 L1190,204 L1258,204 L1258,230 L1324,230 L1324,200 L1392,200 L1392,228 L1460,228 L1460,206 L1528,206 L1528,232 L1596,232 L1596,202 L1664,202 L1664,228 L1732,228 L1732,198 L1800,198 L1800,226 L1866,226 L1866,208 L1920,208 L1920,268 Z" fill="#160f28" opacity="0.92"></path>
<path d="M0,272 L0,238 L1920,238 L1920,272 Z" fill="#160f28" opacity="0.6"></path>

<g transform="translate(960 252) scale(0.62)">
<circle cx="0" cy="-150" r="150" fill="url(#llamp)" opacity="0.34"></circle>
<path d="M-46,0 L-38,-208 L38,-208 L46,0 Z" fill="#2a1d47" stroke="#4a3d63" stroke-width="2"></path>
<path d="M-38,-208 L38,-208 L38,-220 L-38,-220 Z" fill="#372753"></path>
<path d="M-54,-220 L54,-220 L46,-242 L-46,-242 Z" fill="#372753" stroke="#4a3d63" stroke-width="1.5"></path>
<path d="M-46,-242 L0,-330 L46,-242 Z" fill="#241a42" stroke="#4a3d63" stroke-width="2"></path>
<path d="M0,-330 L0,-356" stroke="#caa14a" stroke-width="3"></path>
<circle cx="0" cy="-362" r="6" fill="#caa14a"></circle>
<path d="M-22,-178 L22,-178 L22,-132 Q0,-116 -22,-132 Z" fill="#ffcf8f" opacity="0.9" filter="url(#lglow)"></path>
<path d="M-30,-96 L30,-96 L30,-52 L-30,-52 Z" fill="#caa14a" opacity="0.2"></path>
</g>

<rect x="0" y="248" width="1920" height="832" fill="url(#lground)"></rect>
<ellipse cx="960" cy="262" rx="1180" ry="52" fill="url(#lmistg)"></ellipse>
<ellipse cx="960" cy="300" rx="820" ry="38" fill="url(#lmistg)" opacity="0.7"></ellipse>
<g opacity="0.5">
<ellipse cx="960" cy="1016" rx="1120" ry="86" fill="url(#lmistg)"></ellipse>
<ellipse cx="420" cy="1048" rx="640" ry="58" fill="url(#lmistg)"></ellipse>
<ellipse cx="1500" cy="1052" rx="600" ry="52" fill="url(#lmistg)"></ellipse>
</g>
<path d="M0,986 L1920,986" stroke="#4a3d63" stroke-width="1.5" opacity="0.45"></path>

<g transform="translate(56 60)">
<path d="M0,0 L0,-14 L26,-14" stroke="#caa14a" stroke-width="2" fill="none"></path>
<path d="M0,0 L0,50 L26,50" stroke="#caa14a" stroke-width="2" fill="none"></path>
<text x="18" y="16" font-family="Cinzel, serif" font-size="19" font-weight="700" letter-spacing="4.5" fill="#caa14a">MASTER ALDRIC'S</text>
<text x="18" y="40" font-family="Cinzel, serif" font-size="19" font-weight="700" letter-spacing="4.5" fill="#f4ead6">LADDER OF RITES</text>
</g>

<text x="960" y="120" text-anchor="middle" font-family="Cinzel, serif" font-size="17" letter-spacing="4" fill="#caa14a">ALDRIC'S TOWER</text>
<text x="960" y="146" text-anchor="middle" font-family="Spectral, serif" font-size="15" letter-spacing="1.4" fill="#7d6bab" font-style="italic">every rung is yours to climb</text>
</svg>

<div style="position:absolute;inset:0">
<div style="position:absolute;left:74px;top:132px">
<div style="font:500 12px Cinzel, serif;letter-spacing:2.6px;color:#7d6bab">RITES COMPLETE</div>
<div style="font:700 26px Cinzel, serif;letter-spacing:2px;color:#caa14a;margin-top:4px">{{ readTotal }}</div>
</div>

<div style="position:absolute;left:50px;right:50px;top:190px;bottom:78px;display:flex;align-items:flex-end;justify-content:center;gap:34px">
<sc-for list="{{ districts }}" as="d" hint-placeholder-count="4">
<div style="position:relative;width:412px;box-sizing:border-box;padding:26px 20px 0;display:flex;flex-direction:column;justify-content:flex-end;gap:5px">
<div style="position:absolute;left:5px;top:26px;bottom:96px;width:3px;background:linear-gradient(180deg,#4a3d63,#372753);opacity:.85"></div>
<div style="position:absolute;right:5px;top:26px;bottom:96px;width:3px;background:linear-gradient(180deg,#4a3d63,#372753);opacity:.85"></div>
<div style="position:absolute;left:0;right:0;top:4px;z-index:4;display:flex;justify-content:center">
<div style="{{ d.finial }}"></div>
</div>
<sc-for list="{{ d.rungs }}" as="r" hint-placeholder-count="6">
<div style="{{ r.rung }}">
<div style="{{ r.numBox }}">{{ r.n }}</div>
<div style="flex:1;font:400 12.5px/1.2 Spectral, serif;color:#f4ead6;text-wrap:pretty;overflow:hidden;max-height:30px">{{ r.label }}</div>
<div style="{{ r.dot }}"></div>
<div style="{{ r.checkWrap }}">
<svg viewBox="0 0 20 20" width="12" height="12" style="display:block"><path d="M4,10.6 L8,14.4 L16,5.6" fill="none" stroke="#4fbf7f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
</div>
</sc-for>
<div style="{{ d.plate }}">
<div style="display:flex;align-items:center;gap:12px">
<div style="{{ d.chip }}">{{ d.glyph }}</div>
<div>
<div style="{{ d.nameStyle }}">{{ d.name }}</div>
<div style="font:400 13px Spectral, serif;color:#c9b8e8;margin-top:3px">{{ d.count }}</div>
</div>
</div>
</div>
</div>
</sc-for>
</div>

<div style="position:absolute;left:0;right:0;bottom:34px;text-align:center;font:400 14px Spectral, serif;letter-spacing:1.4px;color:#7d6bab;font-style:italic">All rites unsealed — climb any rung, in any order</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;completed&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;None&quot;,&quot;A few&quot;,&quot;Half&quot;,&quot;Most&quot;,&quot;All&quot;],&quot;default&quot;:&quot;Half&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Progress&quot;},&quot;starCount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:170,&quot;min&quot;:40,&quot;max&quot;:400,&quot;step&quot;:10,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Atmosphere&quot;},&quot;showNumbers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Ladder&quot;},&quot;litRungs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Ladder&quot;}}">
const WF = {
  bpmh: { name:"BPMH & MED REC", color:"#3c6f8f", soft:"#7fb3d0", glyph:"\u2696", list:["Document Medication by Hx","Admission Medication Reconciliation"] },
  cpoe: { name:"CPOE", color:"#3f8f80", soft:"#79c4b5", glyph:"\u2697", list:["Add an Order using CPOE","Modify an Order","Modify a Continuous Infusion Rate","Convert a Normalized-Rate Infusion to Titratable","Cancel and Re-order","Ordering Weight-Based Medications","Ordering a Patient Own Supply","Ordering a Template Non-Formulary","Ordering a Powerplan","Ordering Therapeutic Substitutions","Ordering a Taper or Titration","Ordering Self-Administered Medications","Convert an Order to a Prescription","Create a New Prescription"] },
  oncology: { name:"ONCOLOGY ORDERS", color:"#a8804a", soft:"#d6ac74", glyph:"\u2740", list:["Clinical Verification of Systemic Therapy","Verifying a Regular IV Set","Verifying a Syringe","Verifying a Total Volume IV Set","Verifying an Infusor","Verifying a Subcutaneous Syringe","Verifying Compassionate Supply","Modifying a Dose on PowerChart","Pre-Treatment Powerplans","Skipping a Regimen","Changing Dosing Weight","Changing Products in an IV Set"] },
  verification: { name:"PHARMACIST VERIFICATION", color:"#7a5aa8", soft:"#b39ada", glyph:"\u2721", list:["Verify an Order in Medication Manager","Add an Order using Medication Manager","Modifying an Order in Medication Manager","Copy and Discontinue an Order","Changing an Order Type","Changing a Frequency","Rescheduling an Order","Reprint a Label","Clarifying an Order While Verifying","Voiding and Re-entering an Order","Rejecting an Order for Reassessment","Verifying a Patient Own Supply","Adding an IV Set with a Powdered Vial","Verifying Combinations of Different Strengths","Verifying Powerplans","Verifying a Continuous Infusion","Verifying a Titratable Infusion","Verifying a Bolus off a Continuous Bag","Building an IV Set in Medication Manager","Resolving an Invalid Dose Entry Error"] }
};
const ORDER = ["bpmh","cpoe","oncology","verification"];

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

class Component extends DCLogic {
  state = { scale: 1 };
  componentDidMount(){
    this._fit = () => {
      const s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
      if(s !== this.state.scale) this.setState({ scale: s });
    };
    this._fit();
    window.addEventListener("resize", this._fit);
  }
  componentWillUnmount(){ window.removeEventListener("resize", this._fit); }
  renderVals(){
    const starCount = Math.round(this.props.starCount ?? 170);
    const showNumbers = this.props.showNumbers ?? true;
    const litRungs = this.props.litRungs ?? true;

    const r = rng(20260904);
    const stars = [];
    for(let i=0;i<starCount;i++){
      const y = Math.pow(r(), 1.7) * 300;
      const size = r();
      const twinkle = r() < 0.3;
      stars.push({
        x: +(r()*1920).toFixed(1), y: +y.toFixed(1),
        r: +(0.6 + size*1.9).toFixed(2),
        style: twinkle
          ? { animation: "tw " + (2.4 + r()*4).toFixed(1) + "s ease-in-out " + (r()*5).toFixed(1) + "s infinite", opacity: 0.9 }
          : { opacity: +(0.18 + size*0.5).toFixed(2) }
      });
    }

    const DONE = {
      "None": { bpmh:0, cpoe:0, oncology:0, verification:0 },
      "A few": { bpmh:1, cpoe:3, oncology:2, verification:4 },
      "Half": { bpmh:1, cpoe:7, oncology:6, verification:10 },
      "Most": { bpmh:2, cpoe:12, oncology:9, verification:16 },
      "All": { bpmh:2, cpoe:14, oncology:12, verification:20 }
    };
    const done = DONE[this.props.completed] || DONE["Half"];

    const districts = ORDER.map(key => {
      const D = WF[key];
      const nDone = Math.min(done[key] ?? 0, D.list.length);
      const rungs = D.list.map((label, i) => ({
        key: key + i, n: i + 1, label, complete: i < nDone ? 1 : 0, open: i < nDone ? 0 : 1,
        rung: { position:"relative", zIndex:2, height:"30px", boxSizing:"border-box",
          display:"flex", alignItems:"center", gap:"11px", padding:"0 12px 0 0",
          background:"linear-gradient(90deg, #241a42 0%, #2a1d47 100%)",
          border:"1px solid " + (i < nDone ? "#4fbf7f99" : D.color + "88"),
          boxShadow: litRungs ? "inset 0 0 14px " + (i < nDone ? "#4fbf7f26" : D.color + "33") : "none" },
        numBox: { width:"34px", alignSelf:"stretch", flex:"none", display:showNumbers?"flex":"none",
          alignItems:"center", justifyContent:"center",
          borderRight:"1px solid " + D.color + "66", background:D.color + "22",
          font:"600 12.5px Cinzel, serif", color:D.soft },
        dot: { width:"7px", height:"7px", flex:"none", borderRadius:"50%",
          display: i < nDone ? "none" : "block",
          background:litRungs ? "#ffd79a" : "#4a3d63",
          boxShadow:litRungs ? "0 0 9px #ffd79a" : "none" },
        checkWrap: { display: i < nDone ? "flex" : "none", flex:"none", alignItems:"center",
          justifyContent:"center", width:"18px", height:"18px", borderRadius:"50%",
          background:"#2f7d4f33", border:"1px solid #4fbf7f",
          boxShadow:"0 0 10px #4fbf7f55" }
      })).reverse();
      return {
        key, name:D.name, glyph:D.glyph,
        count: nDone + " of " + D.list.length + " complete",
        rungs,
        finial: { width:"11px", height:"11px", transform:"rotate(45deg)",
          background:D.color, boxShadow:"0 0 14px " + D.color },
        plate: { position:"relative", zIndex:2, marginTop:"12px", height:"84px", boxSizing:"border-box",
          display:"flex", alignItems:"center", padding:"0 16px",
          background:"#1b1230", border:"2px solid " + D.color,
          boxShadow:"0 0 26px " + D.color + "3d" },
        chip: { width:"44px", height:"44px", flex:"none", display:"flex", alignItems:"center",
          justifyContent:"center", border:"1px solid " + D.color, background:D.color + "22",
          font:"400 22px Spectral, serif", color:D.soft },
        nameStyle: { font:"600 14px Cinzel, serif", letterSpacing:"1.7px", color:"#f4ead6" }
      };
    });

    const totalAll = ORDER.reduce((s,k) => s + WF[k].list.length, 0);
    const totalDone = ORDER.reduce((s,k) => s + Math.min(done[k] ?? 0, WF[k].list.length), 0);
    const stage = { position:"relative", width:"1920px", height:"1080px", flex:"none",
      transform:"scale(" + this.state.scale + ")", transformOrigin:"center center" };

    return { stars, districts, stage, readTotal: totalDone + " / " + totalAll };
  }
}
</script>
</body>
</html>
